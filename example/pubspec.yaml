name: flutter_idv_example
description: Demonstrates how to use the flutter_idv plugin.
publish_to: none
version: 1.0.0

environment:
  sdk: '>=3.1.5 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  flutter:
    sdk: flutter
  flutter_idv:
    path: ../
  flutter_document_reader_api: 9.2.926
  flutter_face_api: 8.1.765
  flutter_document_reader_core_fullauthrfid: 9.2.1727
  flutter_face_core_basic: 8.1.365
  flutter_idv_module_document_reader: 3.3.106
  flutter_idv_module_face: 3.3.107
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^5.0.0

flutter:
  uses-material-design: true
