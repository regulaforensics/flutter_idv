name: flutter_idv_example
description: Demonstrates how to use the flutter_idv plugin.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.10.0

dependencies:
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  flutter:
    sdk: flutter
  flutter_idv:
    path: ../
  flutter_idv_module_document_reader: 3.10.349-beta
  flutter_idv_module_face: 3.10.350-beta
  flutter_document_reader_core_fullauthrfid: 9.8.3104-rc
  flutter_face_core_basic: 8.4.693-rc

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
